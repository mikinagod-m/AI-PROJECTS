{% extends "base.html" %}
{% block title %}Load extracts · PCH1{% endblock %}
{% block body %}
<main class="board load-board">
  <header class="mast">
    <p class="eyebrow">Morning board</p>
    <h1 class="mark">PCH1</h1>
    <p class="meta">Load stkavail, fcastbydate, and wo_replen. One workbook is the fallback.</p>
  </header>
  {% if error %}
  <p class="alert" role="alert">{{ error }}</p>
  {% endif %}
  <form class="load-form" action="/load" method="post" enctype="multipart/form-data">
    <label class="file">
      <span>stkavail</span>
      <input type="file" name="stkavail" accept=".xlsx,.xlsm">
    </label>
    <label class="file">
      <span>fcastbydate</span>
      <input type="file" name="fcastbydate" accept=".xlsx,.xlsm">
    </label>
    <label class="file">
      <span>wo_replen</span>
      <input type="file" name="wo_replen" accept=".xlsx,.xlsm">
    </label>
    <label class="file">
      <span>workbook</span>
      <input type="file" name="workbook" accept=".xlsx,.xlsm">
    </label>
    <button class="primary" type="submit">Load</button>
  </form>
</main>
{% endblock %}
